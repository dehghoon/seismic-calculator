<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="t d"><title id="t">Seismic location, ground conditions and floor forces</title><desc id="d">Project coordinates identify the hazard location. Site designation describes ground conditions. Ground motion produces floor forces Fi at elevations hi and base shear V. The sketch is conceptual.</desc><rect width="760" height="370" fill="#f8fbfd"/><g stroke="#315d7c" stroke-width="2" fill="none"><path d="M35 210L180 160L320 210L175 260Z" fill="#e0eef7"/><path d="M175 205V130"/><circle cx="175" cy="115" r="17" fill="#1565c0"/><path d="M175 132L166 150H184Z" fill="#1565c0"/><path d="M400 290H705M440 290V85H620V290M440 225H620M440 155H620M440 85H620"/><path d="M390 290H420M390 225H420M405 290V225"/><path d="M630 85H705M630 155H690M630 225H675" stroke="#1565c0" stroke-width="5"/><path d="M705 85L690 77M705 85L690 93M690 155L675 147M690 155L675 163M675 225L660 217M675 225L660 233"/><path d="M440 320H620M440 340H620" stroke="#0f8f83" stroke-width="4"/></g><g font-family="Arial,sans-serif" fill="#15385a" font-size="17"><text x="40" y="65">1 · Project coordinates</text><text x="40" y="305">Latitude north + / Longitude west −</text><text x="40" y="335">2 · Soil report → X_D, X_C or X_v</text><text x="450" y="50">3 · Building response</text><text x="480" y="120">W₃ at h₃</text><text x="480" y="190">W₂ at h₂</text><text x="480" y="260">W₁ at h₁</text><text x="710" y="91">F₃</text><text x="695" y="161">F₂</text><text x="680" y="231">F₁</text><text x="370" y="264">h₁</text><text x="480" y="365">V = ΣFᵢ</text></g></svg>